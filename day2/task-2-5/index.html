    <h1>Освобождение ресурсов</h1>
    <p>
      <code>createAutoSaver(save, delay)</code> создаёт автосейвер с методами
      <code>schedule(value)</code>, <code>flush()</code> и
      <code>cancel()</code>. После <code>cancel()</code> старый callback не
      выполняется.
    </p>

    </div>

        overflow-y: auto;
        font-family: ui-monospace, monospace;
        font-size: 0.9rem;
        white-space: pre-wrap;
        margin-top: 1rem;
      "
    ></pre>
