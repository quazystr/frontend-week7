<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Focus Timer: Day 6.6</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <h1>Focus Timer</h1>
    <p>Автоматические тесты — в консоли (F12).</p>

    <section>
      <h2>Таймер</h2>

      <div class="display" id="display" aria-hidden="true">25:00</div>

      <!-- Семантический элемент <time> для машинного чтения -->
      <time id="display-time" class="visually-hidden" datetime="PT25M"
        >25 минут 0 секунд</time
      >

      <p class="status">
        <span class="status__label">Статус:</span>
        <span class="status__value" id="status">idle</span>
      </p>

      <div class="controls">
        <button id="start-btn" type="button">Start</button>
        <button id="pause-btn" type="button">Pause</button>
        <button id="reset-btn" type="button">Reset</button>
      </div>
    </section>

    <!-- Регион для анонсов screen reader (не виден визуально) -->
    <div
      id="announcer"
      class="visually-hidden"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <section class="tasks">
      <h2 class="tasks__title">Задачи</h2>

      <div class="tasks__add-row">
        <label for="task-input" class="visually-hidden">Новая задача:</label>
        <input
          class="tasks__input"
          id="task-input"
          type="text"
          placeholder="Новая задача..."
          maxlength="100"
        />
        <button id="task-add-btn" type="button">Добавить</button>
      </div>

      <ul class="tasks__list" id="tasks-list"></ul>
    </section>

    <section class="history">
      <h2 class="history__title">
        <span>История сессий</span>
        <span class="history__count" id="history-count">0 записей</span>
      </h2>

      <ul class="history__list" id="history-list"></ul>

      <div style="text-align: right; margin-top: var(--space-s)">
        <button class="history__clear" id="history-clear-btn" type="button">
          Очистить историю
        </button>
      </div>
    </section>

    <section class="settings">
      <h2 class="settings__title">Настройки</h2>

      <div class="settings__row">
        <label class="settings__label" for="focus-input">Фокус:</label>
        <input
          class="settings__input"
          id="focus-input"
          type="number"
          min="1"
          max="90"
          value="25"
        />
        <span class="settings__unit">мин.</span>
      </div>

      <div class="settings__row">
        <label class="settings__label" for="break-input">Перерыв:</label>
        <input
          class="settings__input"
          id="break-input"
          type="number"
          min="1"
          max="90"
          value="5"
        />
        <span class="settings__unit">мин.</span>
      </div>

      <div
        class="settings__error settings__error_hidden"
        id="settings-error"
        role="alert"
      ></div>
    </section>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
