<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Task 4-5</title>
  </head>
  <body>
    <h1>Скрытая вкладка и deadline</h1>
    <p>
      Отсчёт на 20 секунд. При возврате на вкладку остаток пересчитывается от
      deadline. Уход с вкладки <strong>не ставит</strong> таймер на паузу —
      пауза только по кнопке.
    </p>

    <div
      id="display"
      style="
        font-size: 3rem;
        font-weight: bold;
        font-family: ui-monospace, monospace;
        text-align: center;
        padding: 1rem;
        background: #f5f5f5;
        border-radius: 8px;
      "
    >
      00:20
    </div>

    <p style="text-align: center">
      Состояние: <strong id="state">пауза/стоп</strong> · Отрисовано тиков:
      <strong id="ticks">0</strong>
    </p>

    <div
      style="
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        flex-wrap: wrap;
      "
    >
      <button id="start-btn" type="button">Start</button>
      <button id="pause-btn" type="button">Pause</button>
      <button id="reset-btn" type="button">Reset</button>
      <button id="block-btn" type="button">Заблокировать поток 2500 мс</button>
    </div>

    <pre
      id="log"
      style="
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 1rem;
        border-radius: 4px;
        min-height: 3rem;
        max-height: 320px;
        overflow-y: auto;
        font-family: ui-monospace, monospace;
        font-size: 0.9rem;
        white-space: pre-wrap;
        margin-top: 1rem;
      "
    ></pre>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
